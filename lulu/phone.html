<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>390px 미리보기</title>
<style>
  body{margin:0;background:#20232a;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;color:#cfd3da}
  .row{display:flex;gap:16px;padding:12px;align-items:flex-start}
  .device{width:390px;flex:0 0 390px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .device iframe{display:block;width:390px;height:844px;border:0}
  .t{font-size:12px;padding:6px 14px;color:#8b93a1}
</style>
</head>
<body>
<div class="t">390 × 844 · 신세계몰 채널 · 전체 할인율 · 사이즈 필터 끔</div>
<div class="row">
  <div class="device"><iframe id="a" src="index.html?th=0&ch=s&sz=0&cb=22"></iframe></div>
  <div class="device"><iframe id="b" src="index.html?th=0&sz=1&cb=22"></iframe></div>
</div>
<script>
  window.addEventListener('load', function(){
    setTimeout(function(){
      ['a','b'].forEach(function(id){
        var f = document.getElementById(id), d = f.contentDocument;
        if(!d) return;
        var w = d.documentElement.scrollWidth, b = d.body.scrollWidth;
        document.title = '390px 미리보기 · ' + (w > 390 || b > 390 ? 'OVERFLOW ' + Math.max(w,b) : 'OK ' + w);
      });
    }, 1500);
  });
</script>
</body>
</html>
