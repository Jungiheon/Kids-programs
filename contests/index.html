<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>큐브 · 레고코딩 대회 · 초등 저학년</title>
<meta name="description" content="초등 2학년이 나갈 수 있는 큐브 대회와 레고코딩 대회를 분야별로 모아 접수 상태까지 한눈에. WCA 공인 대회, 한국큐브협회, FLL, WRO, 로봇올림피아드, 로보컵 등.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="대회">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root{
    --ink:#14161a;
    --muted:#6b7280;
    --line:#e8eaee;
    --bg:#f6f6f7;
    --card:#fff;
    --red:#e11d48;
    --red-bg:#fdeef1;
    --blue:#1d4ed8;
    --blue-bg:#eef2ff;
    --amber:#9a6700;
    --amber-bg:#fff6e0;
    --green:#0f7a4a;
    --green-bg:#e8f5ee;
    --dark:#111318;
    --chip:#f1f2f4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:16px;line-height:1.45;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 12px}

  header.top{padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:2px}
  header.top .eyebrow{
    display:flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red);
  }
  header.top h1{margin:2px 0 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
  header.top .sub{margin:3px 0 0;font-size:13px;color:#3d424b;font-weight:600}
  header.top .meta{
    margin:5px 0 0;font-size:12.5px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;
  }
  header.top .meta .dot{color:#c9ced6}
  .summary{margin:10px 0 0;display:flex;gap:6px;flex-wrap:wrap}
  .summary span{
    font-size:12px;font-weight:700;color:#3d424b;background:#fff;
    border:1px solid var(--line);border-radius:999px;padding:4px 9px;
  }
  .summary span b{color:var(--red)}
  .summary span.s b{color:var(--blue)}
  .summary span.t b{color:#7a8290}

  /* sticky filter bar */
  .bar{
    position:sticky;top:0;z-index:30;
    background:rgba(246,246,247,.97);
    backdrop-filter:saturate(180%) blur(8px);
    -webkit-backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--line);
    padding:8px 12px 7px;margin:10px -12px 0;
  }
  .seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{
    flex:0 0 auto;font:inherit;font-size:13.5px;font-weight:700;
    padding:8px 12px;border-radius:10px;border:1px solid var(--line);
    background:#fff;color:#3d424b;cursor:pointer;white-space:nowrap;
  }
  .seg button .n{margin-left:4px;font-weight:600;color:var(--muted);font-size:12px}
  .seg button[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff}
  .seg button[aria-pressed="true"] .n{color:#cbd0d8}

  .chips{display:flex;gap:5px;align-items:center;overflow-x:auto;scrollbar-width:none;margin-top:6px}
  .chips::-webkit-scrollbar{display:none}
  .chips button{
    flex:0 0 auto;font:inherit;font-size:12.5px;font-weight:600;
    padding:5px 9px;border-radius:999px;border:1px solid var(--line);
    background:#fff;color:#4b515b;cursor:pointer;white-space:nowrap;
  }
  .chips button .n{margin-left:4px;font-weight:600;color:#9aa1ab;font-size:11.5px}
  .chips button[aria-pressed="true"]{background:#e9ebef;border-color:#d6d9df;color:var(--ink);font-weight:700}
  .chips button[aria-pressed="true"] .n{color:#5f6672}
  .chips button.st[aria-pressed="true"][data-st="open"]{background:var(--red-bg);border-color:#f4c9d4;color:#a3113a}
  .chips button.st[aria-pressed="true"][data-st="soon"]{background:var(--blue-bg);border-color:#c9d4f8;color:#1b3fa8}
  .chips button.st[aria-pressed="true"][data-st="tbd"]{background:#eef0f3;border-color:#d9dde3;color:#3d424b}
  .chips button.st[aria-pressed="true"][data-st="closed"]{background:#f4f4f5;border-color:#e2e4e8;color:#8a919c}
  .chips button.elig{
    background:#fff;border-color:#bfe3cf;color:var(--green);font-weight:700;
  }
  .chips button.elig .dot2{display:inline-block;width:7px;height:7px;border-radius:50%;background:#cfe9db;margin-right:5px;vertical-align:1px}
  .chips button.elig[aria-pressed="true"]{background:var(--green-bg);border-color:#9fd2b7}
  .chips button.elig[aria-pressed="true"] .dot2{background:var(--green)}
  .chips .divider{flex:0 0 auto;width:1px;height:18px;background:var(--line);margin:0 2px}

  .count{margin:10px 2px 0;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}
  .count b{color:var(--ink)}

  /* cards */
  .list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 12px 11px;position:relative;
  }
  .card.dim{opacity:.72}
  .card .top{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px}
  .badge{
    font-size:11px;font-weight:800;letter-spacing:-.01em;
    padding:3px 7px;border-radius:6px;white-space:nowrap;
  }
  .badge.open{background:var(--red-bg);color:#a3113a}
  .badge.soon{background:var(--blue-bg);color:#1b3fa8}
  .badge.tbd{background:#eef0f3;color:#4b515b}
  .badge.closed{background:#f2f3f5;color:#8a919c}
  .badge.sec{background:#f6f7f9;color:#5f6672;font-weight:700}
  .badge.sec.cube{background:#f3f0ff;color:#4b3a94}
  .badge.sec.lego{background:#eefaf3;color:#12633f}
  .badge.elig{background:var(--green-bg);color:var(--green);font-weight:800}
  .badge.elig.chk{background:var(--amber-bg);color:var(--amber)}
  .badge.elig.no{background:#f2f3f5;color:#8a919c}
  .card h3{margin:0 0 2px;font-size:16.5px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
  .card .org{margin:0 0 8px;font-size:12px;color:#8a919c}
  .rows{display:grid;grid-template-columns:52px 1fr;gap:3px 8px;font-size:13px;line-height:1.4}
  .rows dt{color:#9aa1ab;font-weight:700;font-size:11.5px;padding-top:1px}
  .rows dd{margin:0;color:#2b3038}
  .rows dd b{font-weight:700}
  .when{margin:7px 0 0;font-size:13.5px;font-weight:800;color:var(--dark)}
  .when .r{font-weight:700;font-size:12px;color:var(--muted);display:block;margin-top:1px}
  .sum{margin:8px 0 0;font-size:13px;color:#3d424b;line-height:1.5}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .tags span{font-size:11px;font-weight:700;color:#6b7280;background:#f6f7f9;border-radius:5px;padding:2px 6px}
  .acts{display:flex;gap:8px;margin-top:10px}
  .acts a{
    flex:1 1 auto;text-align:center;text-decoration:none;
    font-size:13px;font-weight:800;padding:9px 10px;border-radius:10px;
    background:var(--dark);color:#fff;
  }
  .acts a.ghost{background:#fff;border:1px solid var(--line);color:#3d424b;flex:0 0 auto}

  .empty{
    background:#fff;border:1px dashed var(--line);border-radius:14px;
    padding:26px 14px;text-align:center;color:var(--muted);font-size:13.5px;margin-top:8px;
  }

  footer{margin-top:18px;font-size:12px;color:#8a919c;line-height:1.55}
  footer .box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-top:10px}
  footer .box h4{margin:0 0 6px;font-size:12.5px;color:#3d424b;font-weight:800}
  footer ol{margin:0;padding-left:16px}
  footer li{margin:3px 0}
  footer a{color:#5f6672;text-decoration:none;border-bottom:1px solid #dcdfe4}
  details summary{cursor:pointer;font-weight:800;color:#3d424b;font-size:12.5px;padding:2px 0}
  details[open] summary{margin-bottom:6px}
  .fine{margin-top:8px;font-size:11.5px;color:#a0a7b2}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Contests · 큐브 · 레고코딩</div>
    <h1 id="title">큐브 · 레고코딩 대회</h1>
    <p class="sub" id="subtitle">초등 저학년이 나갈 수 있는 대회만 골라서</p>
    <p class="meta">
      <span id="updated">불러오는 중…</span>
      <span class="dot">·</span>
      <span id="criteria"></span>
    </p>
    <div class="summary" id="summary"></div>
  </header>

  <div class="bar">
    <div class="seg" id="segField" role="group" aria-label="분야"></div>
    <div class="chips" id="chipsSub" role="group" aria-label="세부분야"></div>
    <div class="chips" id="chipsStatus" role="group" aria-label="접수 상태"></div>
  </div>

  <div class="count"><span id="countLine"></span><span id="sortNote">접수중 → 예정 → 확인중 → 마감</span></div>
  <main class="list" id="list"></main>

  <footer>
    <div class="box" id="disclaimerBox"></div>
    <details class="box" id="sourcesBox">
      <summary>자동 갱신 때 확인할 공식 사이트 <span id="srcCount"></span></summary>
      <ol id="srcList"></ol>
    </details>
    <div class="box">
      <h4>이 앱에 대해</h4>
      <div>공개된 대회 정보만 담았습니다. 아이 이름·생년월일·연락처·주소 같은 개인정보는 이 페이지와 데이터에 들어 있지 않습니다.</div>
      <div class="fine">데이터: <a href="data.json">data.json</a> · 만든 사람이 직접 확인한 날짜는 위 기준 시각입니다.</div>
    </div>
  </footer>
</div>

<script>
(function () {
  var S = { field: 'all', sub: 'all', status: 'all', elig: false };
  var DATA = null;
  var STATUS_ORDER = { open: 0, soon: 1, tbd: 2, closed: 3 };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function wonOrText(v) { return v ? v : '미확인'; }

  function subLabel(id) {
    var s = (DATA.subfields || []).filter(function (x) { return x.id === id; })[0];
    return s ? s.label : id;
  }
  function fieldLabel(id) {
    var f = (DATA.fields || []).filter(function (x) { return x.id === id; })[0];
    return f ? f.label : id;
  }
  function statusMeta(id) {
    var s = (DATA.statuses || []).filter(function (x) { return x.id === id; })[0];
    return s || { id: id, label: id };
  }

  function filtered() {
    return (DATA.items || []).filter(function (it) {
      if (S.field !== 'all' && it.field !== S.field) return false;
      if (S.sub !== 'all' && it.sub !== S.sub) return false;
      if (S.status !== 'all' && it.status !== S.status) return false;
      if (S.elig && it.eligible !== 'yes') return false;
      return true;
    }).sort(function (a, b) {
      var sa = STATUS_ORDER[a.status] == null ? 9 : STATUS_ORDER[a.status];
      var sb = STATUS_ORDER[b.status] == null ? 9 : STATUS_ORDER[b.status];
      if (sa !== sb) return sa - sb;
      var da = a.date_start || '9999-99-99', db = b.date_start || '9999-99-99';
      if (da !== db) return da < db ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
  }

  function renderHeader() {
    var m = DATA.meta || {};
    document.getElementById('title').textContent = m.title || '큐브 · 레고코딩 대회';
    document.getElementById('subtitle').textContent = m.subtitle || '';
    var u = document.getElementById('updated');
    u.textContent = m.updated_label || '';
    document.getElementById('criteria').textContent = m.criteria_label || '';
    if (m.disclaimer) {
      var b = document.getElementById('disclaimerBox');
      b.appendChild(el('h4', null, '읽어 주세요'));
      b.appendChild(el('div', null, m.disclaimer));
      if (m.counts_note) b.appendChild(el('div', 'fine', m.counts_note));
    }
    // summary counts
    var items = DATA.items || [];
    function c(st) { return items.filter(function (i) { return i.status === st; }).length; }
    var box = document.getElementById('summary');
    [['open', '접수중', 'b'], ['soon', '접수예정', 's'], ['tbd', '일정확인중', 't']].forEach(function (t) {
      var s = el('span', t[2] === 's' ? 's' : (t[2] === 't' ? 't' : ''));
      s.innerHTML = t[1] + ' <b>' + c(t[0]) + '</b>';
      box.appendChild(s);
    });
    var total = el('span');
    total.innerHTML = '전체 <b>' + items.length + '</b>';
    box.appendChild(total);
    // sources
    var src = DATA.sources || [];
    document.getElementById('srcCount').textContent = src.length ? '(' + src.length + ')' : '';
    var ol = document.getElementById('srcList');
    src.forEach(function (s) {
      var li = el('li');
      var a = el('a', null, s.name);
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
      li.appendChild(a);
      if (s.note) li.appendChild(el('div', 'fine', s.note));
      ol.appendChild(li);
    });
    document.title = (m.title || '대회') + ' · ' + (m.updated_label || '');
  }

  function renderFieldSeg() {
    var seg = document.getElementById('segField');
    seg.innerHTML = '';
    var items = DATA.items || [];
    var opts = [{ id: 'all', label: '전체' }].concat(DATA.fields || []);
    opts.forEach(function (f) {
      var n = f.id === 'all' ? items.length : items.filter(function (i) { return i.field === f.id; }).length;
      var b = el('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(S.field === f.id));
      b.innerHTML = f.label + ' <span class="n">' + n + '</span>';
      b.addEventListener('click', function () {
        S.field = f.id; S.sub = 'all';
        renderFieldSeg(); renderSubs(); renderStatusChips(); renderList();
      });
      seg.appendChild(b);
    });
  }

  function renderSubs() {
    var box = document.getElementById('chipsSub');
    box.innerHTML = '';
    if (S.field === 'all') { box.style.display = 'none'; return; }
    box.style.display = 'flex';
    var items = DATA.items || [];
    var subs = (DATA.subfields || []).filter(function (s) { return s.field === S.field; });
    if (!subs.length) { box.style.display = 'none'; return; }
    var base = items.filter(function (i) { return i.field === S.field; });
    var allBtn = el('button');
    allBtn.type = 'button';
    allBtn.setAttribute('aria-pressed', String(S.sub === 'all'));
    allBtn.innerHTML = '전체 <span class="n">' + base.length + '</span>';
    allBtn.addEventListener('click', function () { S.sub = 'all'; renderSubs(); renderList(); });
    box.appendChild(allBtn);
    subs.forEach(function (s) {
      var n = base.filter(function (i) { return i.sub === s.id; }).length;
      var b = el('button');
      b.type = 'button';
      b.setAttribute('aria-pressed', String(S.sub === s.id));
      b.innerHTML = s.label + ' <span class="n">' + n + '</span>';
      b.addEventListener('click', function () { S.sub = s.id; renderSubs(); renderList(); });
      box.appendChild(b);
    });
  }

  function renderStatusChips() {
    var box = document.getElementById('chipsStatus');
    box.innerHTML = '';
    var items = (DATA.items || []).filter(function (i) {
      if (S.field !== 'all' && i.field !== S.field) return false;
      if (S.sub !== 'all' && i.sub !== S.sub) return false;
      return true;
    });
    var all = el('button', 'st');
    all.type = 'button';
    all.dataset.st = 'all';
    all.setAttribute('aria-pressed', String(S.status === 'all'));
    all.innerHTML = '상태 전체 <span class="n">' + items.length + '</span>';
    all.addEventListener('click', function () { S.status = 'all'; renderStatusChips(); renderList(); });
    box.appendChild(all);
    (DATA.statuses || []).forEach(function (s) {
      var n = items.filter(function (i) { return i.status === s.id; }).length;
      if (!n) return;
      var b = el('button', 'st');
      b.type = 'button';
      b.dataset.st = s.id;
      b.setAttribute('aria-pressed', String(S.status === s.id));
      b.innerHTML = s.label + ' <span class="n">' + n + '</span>';
      b.addEventListener('click', function () { S.status = s.id; renderStatusChips(); renderList(); });
      box.appendChild(b);
    });
    var div = el('span', 'divider');
    box.appendChild(div);
    var e = el('button', 'elig');
    e.type = 'button';
    e.setAttribute('aria-pressed', String(S.elig));
    e.innerHTML = '<span class="dot2"></span>초2 참가가능만';
    e.addEventListener('click', function () { S.elig = !S.elig; renderStatusChips(); renderList(); });
    box.appendChild(e);
  }

  function eligibilityBadge(it) {
    if (it.eligible === 'yes') return el('span', 'badge elig', '초2 참가가능');
    if (it.eligible === 'check') return el('span', 'badge elig chk', '대상 확인 필요');
    return el('span', 'badge elig no', '참가 어려움');
  }

  function card(it) {
    var c = el('article', 'card' + (it.status === 'closed' ? ' dim' : ''));
    var top = el('div', 'top');
    var st = statusMeta(it.status);
    top.appendChild(el('span', 'badge ' + it.status, st.label));
    top.appendChild(el('span', 'badge sec ' + it.field, fieldLabel(it.field) + ' · ' + subLabel(it.sub)));
    top.appendChild(eligibilityBadge(it));
    c.appendChild(top);

    c.appendChild(el('h3', null, it.name));
    if (it.org) c.appendChild(el('p', 'org', it.org));

    var when = el('div', 'when', it.date_label || '일정 미공지');
    if (it.reg_label) when.appendChild(el('span', 'r', '접수 ' + it.reg_label));
    c.appendChild(when);

    var dl = el('dl', 'rows');
    function row(k, v, strong) {
      if (!v) return;
      dl.appendChild(el('dt', null, k));
      var dd = el('dd');
      if (strong) dd.appendChild(el('b', null, v)); else dd.textContent = v;
      dl.appendChild(dd);
    }
    row('대상', it.target);
    row('장소', it.venue);
    row('참가비', wonOrText(it.fee), true);
    if (it.eligible_note) row('초2', it.eligible_note);
    c.appendChild(dl);

    if (it.summary) c.appendChild(el('p', 'sum', it.summary));

    if (it.tags && it.tags.length) {
      var t = el('div', 'tags');
      it.tags.forEach(function (x) { t.appendChild(el('span', null, x)); });
      c.appendChild(t);
    }

    if (it.link) {
      var acts = el('div', 'acts');
      var a = el('a', null, it.link_label || '공식 페이지 열기');
      a.href = it.link; a.target = '_blank'; a.rel = 'noopener';
      acts.appendChild(a);
      c.appendChild(acts);
    }
    return c;
  }

  function renderList() {
    var list = document.getElementById('list');
    list.innerHTML = '';
    var rows = filtered();
    var parts = [];
    if (S.field !== 'all') parts.push(fieldLabel(S.field));
    if (S.sub !== 'all') parts.push(subLabel(S.sub));
    if (S.status !== 'all') parts.push(statusMeta(S.status).label);
    if (S.elig) parts.push('초2 참가가능');
    document.getElementById('countLine').innerHTML =
      (parts.length ? parts.join(' · ') + ' · ' : '') + '<b>' + rows.length + '</b>곳';
    if (!rows.length) {
      var e = el('div', 'empty', '조건에 맞는 대회가 없습니다. 필터를 풀어 보세요.');
      list.appendChild(e);
      return;
    }
    rows.forEach(function (it) { list.appendChild(card(it)); });
  }

  function boot(data) {
    DATA = data;
    renderHeader();
    renderFieldSeg();
    renderSubs();
    renderStatusChips();
    renderList();
  }

  fetch('data.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(boot)
    .catch(function (err) {
      document.getElementById('updated').textContent = '데이터를 불러오지 못했습니다';
      document.getElementById('list').innerHTML =
        '<div class="empty">data.json을 불러오지 못했습니다 (' + String(err.message || err) + ').<br>잠시 뒤 새로고침해 주세요.</div>';
    });
})();
</script>
